<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台 - 辽宁飞豹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",PingFang SC,sans-serif;background:#f0f2f5;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center}
:root{--red:#cc0000;--radius:12px}
.login-box{background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.12);padding:40px;width:380px;max-width:90vw}
.login-box h1{text-align:center;font-size:1.4rem;margin-bottom:6px;color:#1a1a2e}
.login-box p{text-align:center;font-size:0.85rem;color:#999;margin-bottom:28px}
.login-box label{display:block;font-size:0.85rem;font-weight:600;color:#555;margin-bottom:4px}
.login-box input{width:100%;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:0.95rem;outline:none;transition:.3s;margin-bottom:16px}
.login-box input:focus{border-color:var(--red);box-shadow:0 0 8px rgba(204,0,0,0.1)}
.login-btn{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--red),#990000);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.3s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(204,0,0,0.3)}
.login-error{color:var(--red);font-size:0.85rem;text-align:center;margin-top:10px;display:none}
.login-logo{text-align:center;font-size:3rem;margin-bottom:10px}
 .orders-section{margin-top:12px;padding-top:12px;border-top:1px solid #eee}
 .orders-section summary{cursor:pointer;font-size:0.85rem;color:#999}
 .order-item{padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:0.85rem}
 .order-item:last-child{border-bottom:none}
 .order-item .oi-header{font-weight:600;margin-bottom:3px}
 .order-item .oi-detail{color:#888}
 .order-empty{padding:20px 0;text-align:center;color:#999;font-size:0.88rem}
 
.admin-wrap{width:100%;min-height:100vh;display:none;flex-direction:column}
.admin-header{background:#1a1a2e;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.admin-header h1{font-size:1.2rem}
.admin-header .btn-logout{padding:6px 16px;border-radius:50px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:rgba(255,255,255,0.8);cursor:pointer;font-size:0.82rem;transition:.3s}
.admin-header .btn-logout:hover{background:rgba(255,255,255,0.1);color:#fff}
.admin-body{flex:1;padding:24px;max-width:900px;margin:0 auto;width:100%}
.status-bar{background:#e8f5e9;border:1px solid #c8e6c9;border-radius:8px;padding:10px 16px;font-size:0.85rem;color:#2e7d32;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,0.08);overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 20px;font-weight:700;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.card-body{padding:16px 20px}
.merch-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.merch-item:last-child{border-bottom:none}
.merch-left{display:flex;align-items:center;gap:12px}
.merch-emoji{font-size:1.5rem}
.merch-name{font-weight:700}
.merch-desc{font-size:0.8rem;color:#999;margin-top:2px}
.price-input{width:80px;padding:8px;border:2px solid #ddd;border-radius:8px;font-size:1rem;font-weight:700;color:var(--red);text-align:center;outline:none}
.price-input:focus{border-color:var(--red)}
.actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{padding:10px 28px;border-radius:50px;font-weight:700;cursor:pointer;border:none;transition:.3s}
.btn-primary{background:linear-gradient(135deg,var(--red),#990000);color:#fff}
.btn-primary:hover{transform:translateY(-1px)}
.btn-secondary{background:#fff;color:#666;border:2px solid #ddd}
.btn-secondary:hover{border-color:var(--red);color:var(--red)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#28a745;color:#fff;padding:12px 28px;border-radius:50px;font-weight:600;box-shadow:0 4px 20px rgba(40,167,69,0.3);transition:.4s;opacity:0;z-index:9999}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:#dc3545}
.pwd-section{margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.pwd-section summary{cursor:pointer;font-size:0.85rem;color:#999}
.pwd-field{margin-top:8px;display:flex;gap:8px;align-items:center}
.pwd-field input{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:0.85rem;outline:none;flex:1}
.pwd-field input:focus{border-color:var(--red)}
.pwd-field button{padding:6px 12px;border-radius:6px;border:none;background:var(--red);color:#fff;cursor:pointer;font-size:0.8rem}
.pay-counter{margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.pay-counter summary{cursor:pointer;font-size:0.85rem;color:#999}
.qr-upload{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap}
.qr-box{flex:1;min-width:200px;background:#fff5f5;border-radius:10px;padding:16px;text-align:center}
.qr-preview{width:140px;height:140px;margin:10px auto;border:2px dashed #ddd;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.qr-preview img{max-width:100%;max-height:100%}
.qr-placeholder{color:#ccc;font-size:0.78rem}
.btn-save-qr{padding:6px 16px;border-radius:6px;border:none;background:var(--red);color:#fff;cursor:pointer;font-size:0.82rem;margin-top:8px}
#bankAccount{width:100%;padding:8px;border:2px solid #e0e0e0;border-radius:8px;margin:10px 0;font-size:0.85rem}
.messages-admin{margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.messages-admin summary{cursor:pointer;font-size:0.85rem;color:#999}
.msg-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#fff0f0;color:var(--red);font-size:0.72rem;font-weight:700}
.msg-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;margin-top:10px;background:#fafafa;border:1px solid #eee;border-radius:8px}
.msg-item:last-child{margin-bottom:2px}
.msg-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--red),#990000);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg-name{font-weight:700;color:#333;font-size:0.9rem}
.msg-time{color:#aaa;font-size:0.75rem}
.msg-content{color:#555;font-size:0.85rem;margin-top:6px;line-height:1.6;word-break:break-word}
.msg-del{flex-shrink:0;align-self:center;padding:6px 14px;border:1px solid #f0c4c4;border-radius:6px;background:#fff;color:var(--red);cursor:pointer;font-size:0.78rem;font-weight:600;transition:.2s}
.msg-del:hover{background:var(--red);color:#fff}
.stock-admin{margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.stock-admin summary{cursor:pointer;font-size:0.85rem;color:#999}
.stock-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:0.85rem}
.stock-item:last-child{border-bottom:none}
.stock-item .stock-name{font-weight:700}
.stock-input{width:80px;padding:6px 8px;border:1px solid #ddd;border-radius:6px;text-align:center;font-size:0.9rem}
</style>
</head>
<body>

<!-- Login form -->
<div class="login-box" id="loginBox">
  <div class="login-logo">🏀</div>
  <h1>管理后台登录</h1>
  <p>辽宁飞豹 · 周边价格管理</p>
  <label>密码</label>
  <input type="password" id="loginPwd" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="login-btn" onclick="doLogin()">登 录</button>
  <div class="login-error" id="loginError">密码错误，请重试</div>
</div>

<!-- Admin panel -->
<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <h1>⚙️ 辽宁飞豹 管理后台</h1>
    <button class="btn-logout" onclick="doLogout()">退出登录</button>
  </div>
  <div class="admin-body">
    <div class="status-bar" id="statusBar">本地模式 · 数据保存在本机浏览器</div>
    <div class="card">
      <div class="card-header"><span>📦 周边价格管理</span></div>
      <div class="card-body" id="merchList">加载中...</div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="savePrices()">💾 保存价格</button>
      <button class="btn btn-secondary" onclick="resetPrices()">↺ 恢复默认</button>
    </div>
    <details class="pwd-section">
      <summary>修改密码</summary>
      <div class="pwd-field">
        <input type="password" id="oldPwd" placeholder="原密码">
        <input type="password" id="newPwd" placeholder="新密码">
        <button onclick="changePwd()">修改</button>
      </div>
    </details>
    <details class="orders-section">
      <summary>查看订单</summary>
      <div id="ordersList"><div class="order-empty">暂无订单</div></div>
    </details>
    <details class="pay-counter">
      <summary>收银台 - 设置收款码</summary>
      <div class="qr-upload">
        <div class="qr-box">
          <h4>💚 微信收款码</h4>
          <div class="qr-preview" id="qrWechatPreview"><span class="qr-placeholder">未设置</span></div>
          <input type="file" id="qrWechatInput" accept="image/png,image/jpeg"><br>
          <button class="btn-save-qr" onclick="saveQR('wechat')">保存微信码</button>
        </div>
        <div class="qr-box">
          <h4>💙 支付宝收款码</h4>
          <div class="qr-preview" id="qrAlipayPreview"><span class="qr-placeholder">未设置</span></div>
          <input type="file" id="qrAlipayInput" accept="image/png,image/jpeg"><br>
          <button class="btn-save-qr" onclick="saveQR('alipay')">保存支付宝码</button>
        </div>
        <div class="qr-box">
          <h4>🏦 银行转账账户</h4>
          <input type="text" id="bankAccount" placeholder="6222 0200 1234 5678"><br>
          <button class="btn-save-qr" onclick="saveBank()">保存银行账户</button>
        </div>
      </div>
    </details>
    <details class="messages-admin">
      <summary>删除留言 <span class="msg-count" id="msgCount">0</span></summary>
      <div id="adminMsgsList"><div class="order-empty">暂无留言</div></div>
    </details>
    <details class="stock-admin">
      <summary>库存管理</summary>
      <div id="stockAdminList"></div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveStockAdmin()">💾 保存库存</button>
    </details>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ITEMS=[],DEFAULTS={};
var DEFAULT_PWD="liaoning123";

function getPassword(){
  return localStorage.getItem("liaoning_admin_pwd")||DEFAULT_PWD;
}

function getPricesData(){
  try{return JSON.parse(localStorage.getItem("liaoning_prices"))||{}}catch(e){return{}}
}

function savePricesData(d){
  localStorage.setItem("liaoning_prices",JSON.stringify(d));
}

function showToast(msg,err){
  var t=document.getElementById("toast");
  t.textContent=msg;t.className="toast"+(err?" error":"")+" show";
  setTimeout(function(){t.classList.remove("show")},2500);
}

function doLogin(){
  var pwd=document.getElementById("loginPwd").value;
  document.getElementById("loginError").style.display="none";
  if(pwd===getPassword()){
    sessionStorage.setItem("liaoning_admin_login","1");
    document.getElementById("loginBox").style.display="none";
    document.getElementById("adminWrap").style.display="flex";
    loadPrices();
    loadOrders();
    loadQRs();
    loadBank();
    loadMsgsAdmin();
    loadStockAdmin();
  }else{
    document.getElementById("loginError").style.display="block";
  }
}

function doLogout(){
  sessionStorage.removeItem("liaoning_admin_login");
  document.getElementById("loginBox").style.display="block";
  document.getElementById("adminWrap").style.display="none";
}

function checkAuth(){
  if(sessionStorage.getItem("liaoning_admin_login")==="1"){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("adminWrap").style.display="flex";
    loadPrices();
    loadOrders();
    loadQRs();
    loadBank();
    loadMsgsAdmin();
    loadStockAdmin();
  }
}

function loadPrices(){
  DEFAULTS={"辽宁飞豹主场球衣":299,"辽宁飞豹客场球衣":299,"辽宁飞豹棒球帽":129,"辽宁飞豹围巾":99,"辽宁飞豹双肩包":199,"辽宁飞豹签名篮球":599};
  var data=getPricesData();
  ITEMS=Object.keys(DEFAULTS).map(function(n){
    return{name:n,price:(typeof data[n]==="number")?data[n]:DEFAULTS[n],dp:DEFAULTS[n]};
  });
  render();
}

function render(){
  var list=document.getElementById("merchList");list.innerHTML="";
  ITEMS.forEach(function(it,i){
    var ch=it.price!==it.dp;
    list.innerHTML+="<div class=\"merch-item\"><div class=\"merch-left\"><span class=\"merch-emoji\">👕</span><div><div class=\"merch-name\">"+it.name+"</div><div class=\"merch-desc\">默认: ¥"+it.dp+(ch?" · <span style=\"color:var(--red)\">已修改</span>":"")+"</div></div></div><div><span style=\"font-weight:700;color:var(--red)\">¥</span><input class=\"price-input\" type=\"number\" id=\"p"+i+"\" value=\""+it.price+"\"></div></div>";
  });
}

function savePrices(){
  var data={};
  ITEMS.forEach(function(it,i){data[it.name]=parseInt(document.getElementById("p"+i).value)||it.price});
  savePricesData(data);
  showToast("价格已保存");
  loadPrices();
}

function resetPrices(){
  if(!confirm("确定恢复默认？"))return;
  savePricesData({});
  showToast("已恢复默认");
  loadPrices();
}

function changePwd(){
  var o=document.getElementById("oldPwd").value;
  var n=document.getElementById("newPwd").value;
  if(!o||!n){showToast("请填写完整",true);return}
  if(o!==getPassword()){showToast("原密码错误",true);return}
  localStorage.setItem("liaoning_admin_pwd",n);
  document.getElementById("oldPwd").value="";
  document.getElementById("newPwd").value="";
  showToast("密码已修改");
}

function escHtml(s){
  var d=document.createElement("div");
  d.textContent=s==null?"":String(s);
  return d.innerHTML;
}

function loadMsgsAdmin(){
  var msgs=[];
  try{msgs=JSON.parse(localStorage.getItem("liaoning_msgs"))||[]}catch(e){msgs=[]}
  var list=document.getElementById("adminMsgsList");
  if(!list)return;
  var count=document.getElementById("msgCount");
  if(count)count.textContent=msgs.length;
  if(!msgs.length){list.innerHTML='<div class="order-empty">暂无留言</div>';return}
  list.innerHTML=msgs.map(function(m,i){
    var name=m.n||"匿名",content=m.c||"",time=m.t||"";
    return '<div class="msg-item"><div class="msg-avatar">'+escHtml(name.charAt(0))+'</div><div class="msg-body"><div class="msg-head"><span class="msg-name">'+escHtml(name)+'</span><span class="msg-time">'+escHtml(time)+'</span></div><div class="msg-content">'+escHtml(content)+'</div></div><button class="msg-del" onclick="deleteMsg('+i+')">删除</button></div>';
  }).join("");
}

function deleteMsg(i){
  var msgs=[];
  try{msgs=JSON.parse(localStorage.getItem("liaoning_msgs"))||[]}catch(e){msgs=[]}
  if(i<0||i>=msgs.length)return;
  if(!confirm("确定删除这条留言？"))return;
  msgs.splice(i,1);
  localStorage.setItem("liaoning_msgs",JSON.stringify(msgs));
  loadMsgsAdmin();
  showToast("留言已删除");
}

var STOCK_DEFAULTS={"辽宁飞豹主场球衣":30,"辽宁飞豹客场球衣":30,"辽宁飞豹棒球帽":50,"辽宁飞豹围巾":50,"辽宁飞豹双肩包":30,"辽宁飞豹签名篮球":20};
function loadStockAdmin(){
  var data={};
  try{data=JSON.parse(localStorage.getItem("liaoning_stock"))||{}}catch(e){data={}}
  var list=document.getElementById("stockAdminList");
  if(!list)return;
  list.innerHTML=Object.keys(STOCK_DEFAULTS).map(function(n,i){
    var v=(typeof data[n]==="number")?data[n]:STOCK_DEFAULTS[n];
    return '<div class="stock-item"><span class="stock-name">'+escHtml(n)+'</span><input class="stock-input" type="number" min="0" id="stock'+i+'" value="'+v+'"></div>';
  }).join("");
}

function saveStockAdmin(){
  var data={};
  Object.keys(STOCK_DEFAULTS).forEach(function(n,i){
    var v=parseInt(document.getElementById("stock"+i).value,10);
    if(isNaN(v)||v<0)v=0;
    data[n]=v;
  });
  localStorage.setItem("liaoning_stock",JSON.stringify(data));
  loadStockAdmin();
  showToast("库存已保存");
}

function loadBank(){
  var el=document.getElementById("bankAccount");
  if(el) el.value=localStorage.getItem("liaoning_bank_account")||"";
}

function saveBank(){
  var account=document.getElementById("bankAccount").value.trim();
  if(!account){showToast("请填写银行账户",true);return}
  localStorage.setItem("liaoning_bank_account",account);
  showToast("银行账户已保存");
}

function loadQRs(){
  ["wechat","alipay"].forEach(function(t){
    var p=document.getElementById("qr"+t.charAt(0).toUpperCase()+t.slice(1)+"Preview");
    var v=localStorage.getItem("liaoning_qr_"+t);
    if(v){
      p.innerHTML="<img src='"+v+"' alt='收款码'>";
    }else{
      p.innerHTML='<span class="qr-placeholder">未设置</span>';
    }
  });
}

function saveQR(type){
  var input=document.getElementById("qr"+type.charAt(0).toUpperCase()+type.slice(1)+"Input");
  var file=input.files[0];
  if(!file){showToast("请先选择图片",true);return}
  var reader=new FileReader();
  reader.onload=function(e){
    localStorage.setItem("liaoning_qr_"+type,e.target.result);
    showToast("收款码已保存");
    loadQRs();
  };
  reader.readAsDataURL(file);
}

function loadOrders(){
  var orders=JSON.parse(localStorage.getItem("liaoning_orders")||"[]");
  var list=document.getElementById("ordersList");
  if(!orders.length){list.innerHTML='<div class="order-empty">暂无订单</div>';return}
  list.innerHTML=orders.map(function(o,i){
    var color=i<3?"#e8f5e9":"#fff";
    return '<div class="order-item" style="background:'+color+'"><div class="oi-header">'+(i+1)+'. '+o.item+' × '+o.qty+'</div><div class="oi-detail">'+o.name+' | '+o.phone+'<br>'+o.addr+(o.note?'<br>备注：'+o.note:'')+'<br><span style="color:#999;font-size:0.78rem">'+o.time+'</span></div></div>';
  }).join("");
}

// Auto-check auth on load
checkAuth();
</script>
</body>
</html>
